# SamWiki skin on GitHub's supported Cayman theme.
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# remote_theme pins pages-themes/cayman@v0.2.0. assets/css/style.scss sets the
# SamWiki color tokens, then imports jekyll-theme-cayman. The homepage front
# matter sets samwiki: true, and the same flag is set here.

title: Autonomous Access Control
description: Synthetic camera events for security data and AI alarm access control systems.
remote_theme: pages-themes/cayman@v0.2.0
url: https://sdcastillo.github.io
baseurl: /autonomous-access-control
samwiki: true
show_downloads: false
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      samwiki: true

exclude:
  - README.md
  - "chatGPT prompt.md"
  - Gemfile
  - Gemfile.lock
  - vendor
